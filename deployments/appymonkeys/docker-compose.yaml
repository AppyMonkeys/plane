# Pinned so this stays the same Compose project (and keeps using the
# existing plane-app_* volumes/containers) regardless of which directory
# this file is run from.
name: plane-app

x-db-env: &db-env
  PGHOST: ${PGHOST:-plane-db}
  PGDATABASE: ${PGDATABASE:-plane}
  POSTGRES_USER: ${POSTGRES_USER:-plane}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-plane}
  POSTGRES_DB: ${POSTGRES_DB:-plane}
  POSTGRES_PORT: ${POSTGRES_PORT:-5432}
  PGDATA: ${PGDATA:-/var/lib/postgresql/data}

x-redis-env: &redis-env
  REDIS_HOST: ${REDIS_HOST:-plane-redis}
  REDIS_PORT: ${REDIS_PORT:-6379}
  REDIS_URL: ${REDIS_URL:-redis://plane-redis:6379/}

x-minio-env: &minio-env
  MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-access-key}
  MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-secret-key}

x-aws-s3-env: &aws-s3-env
  AWS_REGION: ${AWS_REGION:-}
  # Leave AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY unset in .env to use the EC2
  # instance role instead (same as backup-scripts/run-backup.sh) -- plane/settings/
  # storage.py treats an empty value here as "not provided" and falls through to
  # boto3's default credential chain (env -> ~/.aws/credentials -> IMDS role).
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
  AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-}
  AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
  # Optional "folder" prefix within the bucket -- lets this share a bucket (e.g.
  # one already used for backups) without its keys colliding with anything else.
  AWS_S3_KEY_PREFIX: ${AWS_S3_KEY_PREFIX:-}

x-proxy-env: &proxy-env
  APP_DOMAIN: ${APP_DOMAIN:-localhost}
  FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-5242880}
  CERT_EMAIL: ${CERT_EMAIL}
  CERT_ACME_CA: ${CERT_ACME_CA}
  CERT_ACME_DNS: ${CERT_ACME_DNS}
  LISTEN_HTTP_PORT: ${LISTEN_HTTP_PORT:-80}
  LISTEN_HTTPS_PORT: ${LISTEN_HTTPS_PORT:-443}
  BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
  SITE_ADDRESS: ${SITE_ADDRESS:-:80}

x-mq-env: &mq-env # RabbitMQ Settings
  RABBITMQ_HOST: ${RABBITMQ_HOST:-plane-mq}
  RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
  RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-plane}
  RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-plane}
  RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-plane}
  RABBITMQ_VHOST: ${RABBITMQ_VHOST:-plane}

x-live-env: &live-env
  API_BASE_URL: ${API_BASE_URL:-http://api:8000}
  LIVE_SERVER_SECRET_KEY: ${LIVE_SERVER_SECRET_KEY}

x-app-env: &app-env
  WEB_URL: ${WEB_URL:-http://localhost}
  DEBUG: ${DEBUG:-0}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
  GUNICORN_WORKERS: 1
  USE_MINIO: ${USE_MINIO:-1}
  DATABASE_URL: ${DATABASE_URL:-postgresql://plane:plane@plane-db/plane}
  SECRET_KEY: ${SECRET_KEY}
  AMQP_URL: ${AMQP_URL:-amqp://plane:plane@plane-mq:5672/plane}
  API_KEY_RATE_LIMIT: ${API_KEY_RATE_LIMIT:-60/minute}
  MINIO_ENDPOINT_SSL: ${MINIO_ENDPOINT_SSL:-0}
  LIVE_SERVER_SECRET_KEY: ${LIVE_SERVER_SECRET_KEY}
  WEBHOOK_ALLOWED_IPS: ${WEBHOOK_ALLOWED_IPS:-}
  WEBHOOK_ALLOWED_HOSTS: ${WEBHOOK_ALLOWED_HOSTS:-}
  VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
  VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
  VAPID_ADMIN_EMAIL: ${VAPID_ADMIN_EMAIL:-admin@example.com}
  # Exposes the OpenAPI/Swagger schema (api/schema/, api/schema/swagger-ui/,
  # api/schema/redoc/) so developers (e.g. the Unity ticket-viewer tool) can
  # browse/generate against the real API surface instead of reading source.
  ENABLE_DRF_SPECTACULAR: ${ENABLE_DRF_SPECTACULAR:-1}

services:
  # web/space/admin/live/api/worker/beat-worker/migrator are built from this
  # repo (../.. from here -- the plane-src root) instead of pulling the
  # prebuilt makeplane/plane-* images, so this fork's changes (browser push
  # notifications, PWA support, etc.) actually ship. Rebuild after any
  # change with `docker compose build <service>` (or `--build` on `up`); a
  # plain `up` reuses whatever was already built. `proxy` still uses the
  # official image -- nothing in this fork touches it.
  web:
    build:
      context: ../..
      dockerfile: ./apps/web/Dockerfile.web
    image: plane-frontend:local
    restart: unless-stopped
    deploy:
      replicas: ${WEB_REPLICAS:-1}
    depends_on:
      - api
      - worker

  space:
    build:
      context: ../..
      dockerfile: ./apps/space/Dockerfile.space
    image: plane-space:local
    restart: unless-stopped
    deploy:
      replicas: ${SPACE_REPLICAS:-1}
    depends_on:
      - api
      - worker
      - web

  admin:
    build:
      context: ../..
      dockerfile: ./apps/admin/Dockerfile.admin
    image: plane-admin:local
    restart: unless-stopped
    deploy:
      replicas: ${ADMIN_REPLICAS:-1}
    depends_on:
      - api
      - web

  live:
    build:
      context: ../..
      dockerfile: ./apps/live/Dockerfile.live
    image: plane-live:local
    environment:
      <<: [*live-env, *redis-env]
    restart: unless-stopped
    deploy:
      replicas: ${LIVE_REPLICAS:-1}
    depends_on:
      - api
      - web

  api:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile.api
    image: plane-backend:local
    command: ./bin/docker-entrypoint-api.sh
    restart: unless-stopped
    deploy:
      replicas: ${API_REPLICAS:-1}
    volumes:
      - logs_api:/code/plane/logs
    environment:
      <<: [*app-env, *db-env, *redis-env, *minio-env, *aws-s3-env, *proxy-env]
    depends_on:
      - plane-db
      - plane-redis
      - plane-mq

  worker:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile.api
    image: plane-backend:local
    command: ./bin/docker-entrypoint-worker.sh
    restart: unless-stopped
    deploy:
      replicas: ${WORKER_REPLICAS:-1}
    volumes:
      - logs_worker:/code/plane/logs
    environment:
      <<: [*app-env, *db-env, *redis-env, *minio-env, *aws-s3-env, *proxy-env]
    depends_on:
      - api
      - plane-db
      - plane-redis
      - plane-mq

  beat-worker:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile.api
    image: plane-backend:local
    command: ./bin/docker-entrypoint-beat.sh
    restart: unless-stopped
    deploy:
      replicas: ${BEAT_WORKER_REPLICAS:-1}
    volumes:
      - logs_beat-worker:/code/plane/logs
    environment:
      <<: [*app-env, *db-env, *redis-env, *minio-env, *aws-s3-env, *proxy-env]
    depends_on:
      - api
      - plane-db
      - plane-redis
      - plane-mq

  migrator:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile.api
    image: plane-backend:local
    command: ./bin/docker-entrypoint-migrator.sh
    restart: on-failure
    deploy:
      replicas: 1
    volumes:
      - logs_migrator:/code/plane/logs
    environment:
      <<: [*app-env, *db-env, *redis-env, *minio-env, *aws-s3-env, *proxy-env]
    depends_on:
      - plane-db
      - plane-redis

  # Comment this if you already have a database running
  plane-db:
    image: postgres:15.7-alpine
    command: postgres -c 'max_connections=1000'
    restart: unless-stopped
    deploy:
      replicas: 1
    environment:
      <<: *db-env
    volumes:
      - pgdata:/var/lib/postgresql/data

  plane-redis:
    image: valkey/valkey:7.2.11-alpine
    restart: unless-stopped
    deploy:
      replicas: 1
    volumes:
      - redisdata:/data

  plane-mq:
    image: rabbitmq:3.13.6-management-alpine
    restart: unless-stopped
    deploy:
      replicas: 1
    environment:
      <<: *mq-env
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  # Replaced by real S3 (see AWS_S3_* in .env, and storage.py's IAM-role
  # fallback) -- kept here, commented, in case of rollback. The old `uploads`
  # named volume is left declared below (untouched, not deleted) as the
  # rollback's data.
  # plane-minio:
  #   image: quay.io/minio/minio:latest
  #   command: server /export --console-address ":9090"
  #   restart: unless-stopped
  #   deploy:
  #     replicas: 1
  #   environment:
  #     <<: *minio-env
  #   volumes:
  #     - uploads:/export

  # Comment this if you already have a reverse proxy running
  # No host ports published: edge-proxy/ is the single thing that binds
  # 80/443 on this host, terminates TLS, and reverse-proxies to this
  # service's internal port 80 (see edge-proxy/Caddyfile). Run
  # `docker compose -f edge-proxy/docker-compose.yaml up -d` alongside
  # this stack -- Plane isn't reachable from outside the host without it.
  proxy:
    image: makeplane/plane-proxy:${APP_RELEASE:-v1.4.2}
    restart: unless-stopped
    deploy:
      replicas: 1
    environment:
      <<: *proxy-env
    volumes:
      - proxy_config:/config
      - proxy_data:/data
    depends_on:
      - web
      - api
      - space
      - admin
      - live

  # Backups run on a host cron job (backup-scripts/run-backup.sh), not as a
  # compose service -- it stops this stack (except plane-db), streams a
  # pg_dump + a tar of the uploads volume straight to S3, then restarts
  # every service one at a time. See backup-scripts/README.md.

volumes:
  pgdata:
  redisdata:
  uploads:
  logs_api:
  logs_worker:
  logs_beat-worker:
  logs_migrator:
  rabbitmq_data:
  proxy_config:
  proxy_data:
